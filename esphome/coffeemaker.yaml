substitutions:
  name: coffeemaker
  description: "Measures water tank level and displays a gauge"
  encryption_key: !secret api_key
  ota_password: !secret ota_pass
  log_level: DEBUG

packages:
  <<: !include_dir_named common
  board: !include boards/wemos_d1_mini.yaml

mqtt: !remove

# --- time of fligt sensor
i2c:
  sda: GPIO4
  scl: GPIO5
  scan: true
  id: bus_a

sensor:
  - platform: vl53l0x
    id: "water_surface"
    address: 0x29
    update_interval: 1s
    long_range: false
    accuracy_decimals: 3
    filters: 
      - clamp: 
          max_value: 0.229
          ignore_out_of_range: true
      # Exponential Moving Average smooths out drift instantly without lagging updates.
      # send_every: 1 ensures real-time reporting every second.
      # alpha: 0.2 means 20% weight to new reading, 80% to historical average.
      - exponential_moving_average:
          alpha: 0.2
          send_every: 1
    on_value: 
      then:
        - component.update: water_level

  - platform: template
    name: "water_level"
    id: water_level
    unit_of_measurement: "L"
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - throttle: 10s
    lambda: |-
      const float tank_size = 2.0;
      const float tank_empty = 235.0;
      const float tank_full = 38.0;
      float level = (id(water_surface).state * 1000.0) - tank_full;
      if (level < 0.0) {
        level = 0.0;
      }
      float ml_per_mm = tank_size / (tank_empty - tank_full);
      float amount = tank_size - (ml_per_mm * level);
      return (amount > 0.0 ? amount : 0.0);
    # Removed the 'send_every: 10' median filter so LED updates aren't held back by 10s
    on_value: 
      then:
        - component.update: water_level_percentage

  - platform: template
    id: water_level_percentage
    name: "water_level_percentage"
    unit_of_measurement: '%'
    accuracy_decimals: 0
    filters:
      - throttle: 30s
    lambda: |-
      const float tank_size = 2.0;
      float pct = (id(water_level).state / tank_size) * 100.0;
      if (pct > 100.0) return 100.0;
      if (pct < 0.0) return 0.0;
      return pct;

light:
  - platform: neopixelbus
    type: GRB
    variant: WS2812
    pin: GPIO3
    num_leds: 10
    id: water_level_light
    name: "Water level light"
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 0s
    gamma_correct: 1.0
    on_turn_on:
      then:
        - light.control:
            id: water_level_light
            brightness: 5%
            effect: "Level with colors"
    effects:
      - addressable_lambda:
          name: "Level with colors"
          update_interval: 200ms
          lambda: |-
            static uint16_t lastcolor = 0;
            // Static color array calibrated to compensate for LED dimming
            
            static const esphome::Color colors[10] = {
              esphome::Color(255, 0, 0),     // LED 0: Pure Red
              esphome::Color(255, 65, 0),    // LED 1: Red-Orange (Boosted Green)
              esphome::Color(255, 130, 0),   // LED 2: Orange (Boosted Green)
              esphome::Color(255, 180, 0),   // LED 3: Yellow-Orange
              esphome::Color(255, 230, 0),   // LED 4: Yellow
              esphome::Color(200, 255, 0),   // LED 5: Lime-Yellow
              esphome::Color(130, 255, 0),   // LED 6: Lime-Green
              esphome::Color(70, 255, 0),    // LED 7: Light Green
              esphome::Color(30, 255, 0),    // LED 8: Green
              esphome::Color(0, 255, 0)      // LED 9: Pure Green
            };
            
            float pct = id(water_level_percentage).state;
            if (std::isnan(pct)) return;

            int plevel = floor(pct / 10.0f);
            if (plevel > 10) plevel = 10;

            for (int i = 0; i < it.size(); i++) {
              if (i < plevel) {
                it[i] = colors[i];
              } else {
                it[i] = esphome::Color::BLACK;
              }
            }

            // Low level override: Keep 1 solid Red LED visible down to >5% level
            if (plevel == 0) {
              if (id(water_level).state > 0.15 && lastcolor == 1) {
                it[0] = esphome::Color::BLACK;
              } else {
                it[0] = colors[0];
              }
            }