substitutions:
  name: wardrobe
  description: "Temperature sensors for culvert"
  encryption_key: !secret api_key
  ota_password: !secret ota_pass
  log_level: DEBUG

packages:
  <<: !include_dir_named common
  board: !include boards/wemos_d1_mini.yaml
  1wire: !include components/1wire.yaml

mqtt: !remove

sensor:
  - platform: dallas_temp
    address: 0xba3c01e076781e28
    name: "house hot water supply"
    update_interval: 10s

  - platform: dallas_temp
    address: 0x583cffe076793a28
    name: "house floor heat supply"
    id: supply
    update_interval: 30s

  - platform: dallas_temp
    address: 0x153c01e07692a428
    name: "house floor heat return 1" # kitchen north
    id: ret_1
    update_interval: 30s
    on_value:
      then:
        - component.update: ret_1_delta

  - platform: template
    name: "house floor heat return 1 delta"
    device_class: "temperature"
    unit_of_measurement: "°C"
    id: ret_1_delta
    update_interval: never
    lambda: |-
      if (id(supply).state >= id(ret_1).state) {
        return (id(supply).state - id(ret_1).state);
      } else {
        return 0;
      }

  - platform: dallas_temp
