- alias: "bathroom downstairs: litterbox motion"
  id: 727453fd-3200-4e32-8559-444d5d4fa5f0
  mode: single
  trace:
    stored_traces: 10
  triggers:
    trigger: state
    entity_id: binary_sensor.motion_litterbox_occupancy
    from: "on"
    to: "off"

  conditions:
    - condition: state
      entity_id: binary_sensor.litterbox_door
      state: "off"
      for:
        minutes: 2  # cooldown for the motion sensor is 90s

  actions:
    - action: input_number.increment
      target:
        entity_id: input_number.litterbox_visits

    - action: notify.mobile_app_kb2003
      data:
        title: "Kattlådan"
        message: "En katt har besökt skithuset (besök: {{ states('input_number.litterbox_visits')|int }})"

    - choose:
      - conditions:
          - condition: state
            entity_id: input_number.litterbox_visits
            state: "10"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.donetick_things_litterbox_full
          # - action: donetick.update_task
          #   data:
          #     force_unarchive: false
          #     task_id: "{{ state_attr('sensor.donetick_chores_tom_kattladan', 'task_id') }}"
          #     due_date: '{{ utcnow().isoformat() }}'



- alias: "bathroom downstairs: litterbox lid"
  id: 54b71a54-7a02-4d84-aebd-f4d81d14f7f9
  mode: single
  trace:
    stored_traces: 10
  triggers:
    trigger: state
    entity_id: binary_sensor.litterbox_door
    from: "on"
    to: "off"

  conditions: []

  actions:
    - variables:
        task_id: "{{ state_attr('sensor.donetick_chores_tom_kattladan', 'task_id') }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.litterbox_visits
      data:
        value: 0

    - choose:
      - conditions:
          - condition: numeric_state
            entity_id: zone.home
            above: 1
        sequence:
          - action: donetick.complete_task
            data:
              completed_by: 2
              task_id: "{{ task_id }}"

      - conditions:
          - condition: state
            entity_id: zone.home
            state: "1"
        sequence:
          - choose:
              - conditions: "{{ states('person.linus') == 'home' }}"
                sequence:
                  - action: donetick.complete_task
                    data:
                      completed_by: 1
                      task_id: "{{ task_id }}"
            default:
              - action: donetick.complete_task
                data:
                  completed_by: 2
                  task_id: "{{ task_id }}"

    # make chore visable to ha again
    - action: donetick.update_task
      data:
        task_id: "{{ task_id }}"
        force_unarchive: true

    # # turned on as complete action in chore
    # - action: switch.turn_off
    #   target:
    #     entity_id: switch.donetick_things_litterbox_full
