- alias: "bathroom downstairs: litterbox"
  id: 727453fd-3200-4e32-8559-444d5d4fa5f0
  mode: single
  trace:
    stored_traces: 10
  triggers:
    trigger: state
    entity_id: binary_sensor.motion_litterbox_occupancy
    from: "off"
    to: "on"

  conditions: []
    # litterbox should be closed

  actions:
    - action: input_number.increment
      target:
        entity_id: input_number.litterbox_visits

    - action: notify.mobile_app_kb2003
      data:
        title: "Kattskit"
        message: "Besök på skithuset (besök: {{ states('input_number.litterbox_visits') }})"
