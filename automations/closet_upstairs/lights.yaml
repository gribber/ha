- alias: "closet upstairs: lights"
  id: debcb858-dffa-4a81-9224-56fb03d6c15f
  mode: queued
  triggers:

    - trigger: event
      event_type:
        - automation_reloaded

    - trigger: state
      entity_id:
        - binary_sensor.closet_upstairs_door_contact

  actions:
    - choose:
        - conditions:
            - alias: "when door is open"
              condition: state
              entity_id:
                - binary_sensor.closet_upstairs_door_contact
              state: "on"

          sequence:
            - alias: "turn on the lights"
              action: light.turn_on
              target:
                entity_id: light.closet_upstaris
              data:
                brightness: 255

      default:
        - action: light.turn_off
          target:
            entity_id: light.closet_upstaris
