- alias: "garage: lights"
  id: b10a0b7d-74bb-48f7-aee5-6233c82149ab
  mode: queued
  trigger:
    - platform: homeassistant
      event: start

    - platform: event
      event_type:
        - automation_reloaded

    - platform: state
      entity_id:
        - binary_sensor.motion_garage_occupancy
      from: "off"
      to: "on"

    - platform: state
      entity_id:
        - binary_sensor.motion_garage_occupancy
      from: "on"
      to: "off"
      for:
        minutes: 60
      id: motion_off

    - trigger: state
      entity_id: event.garage_remote_1_action
      not_from: unavailable
      id: remote


  action:
    - choose:
      - conditions:
          - condition: trigger
            id: remote
        sequence:
          - variables:
              action: "{{ trigger.to_state.attributes.event_type }}"

          - choose:
              - conditions: "{{ action in ['on'] }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id:
                        - light.garage_garage_bench
                        - light.garage_garage_ceiling

              - conditions: "{{ action in ['off'] }}"
                sequence:
                  - action: light.turn_off
                    target:
                      entity_id:
                        - light.garage_garage_bench
                        - light.garage_garage_ceiling

      - conditions:
          - condition: trigger
            id: motion_off
        sequence:
          - action: light.turn_off
            target:
              entity_id:
                - light.garage_garage_bench
                - light.garage_garage_ceiling


      - alias: "when triggered"
        conditions:
          - alias: "and motion is detected"
            condition: state
            entity_id:
              - binary_sensor.motion_garage_occupancy
            state: "on"

          - alias: "and we aren't home (intruder alert?!)"
            condition: state
            entity_id:
              - input_boolean.house_mode_away
            state: "on"

        sequence:
          - alias: "doom"
            service: script.turn_on
            target:
              entity_id: script.garage_doom

