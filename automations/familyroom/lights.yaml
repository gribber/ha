- alias: "Family room: lights"
  id: 8b53f10d-df56-421e-9e89-08cb39f16c7d
  triggers:
    - trigger: homeassistant
      event: start

    - trigger: event
      event_type:
        - automation_reloaded
        - scene_reloaded

    - trigger: state
      entity_id:
        - input_boolean.house_mode_bright_inside

    - trigger: time
      at:
        - input_datetime.time_goodmorning
        - input_datetime.time_goodnight

    # - trigger: state
    #   entity_id:
    #     - sensor.family_room_remote_action
    #   id: remote

    # test of new event based trigger
    - trigger: state
      entity_id: event.family_room_remote_action
      not_from: unavailable
      id: remote

    - trigger: state
      entity_id:
        - event.allrum_pyssel_remote_button_1
        - event.allrum_pyssel_remote_button_2
      not_from: unavailable
      id: pyssel_remote

    - trigger: state
      id: senile
      entity_id:
        - group.motion_family_room
        # - binary_sensor.motion_familyroom_occupancy
      from: "on"
      to: "off"
      for:
        minutes: "{{ states('input_number.family_room_timeout')|int }}"

  actions:
    choose:
      - conditions:
          - condition: trigger
            id: remote
        sequence:
          - variables:
              #action: "{{ trigger.to_state.state }}"
              action: "{{ trigger.to_state.attributes.event_type }}"

          - choose:
              - conditions: "{{ action in ['on'] }}"
                sequence:
                  - choose:
                      - conditions: "{{ states('light.family_room_ceiling') == 'off' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id:
                                - light.family_room_ceiling
                            data:
                              brightness: 255
                    default:
                      - action: light.turn_off
                        target:
                          entity_id:
                            - light.family_room_ceiling
              - conditions: "{{ action in ['brightness_move_up'] }}"
                sequence:
                  - choose:
                      - conditions: "{{ state_attr('light.family_room_ceiling', 'brightness') in [none, 255] }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id:
                                - light.family_room_ceiling
                            data:
                              brightness: 120
                              transition: 1
                    default:
                      - action: light.turn_on
                        target:
                          entity_id:
                            - light.family_room_ceiling
                        data:
                          brightness: 255
                          transition: 1
              - conditions: "{{ action in ['off'] }}"
                sequence:
                  - choose:
                      - conditions: "{{ states('light.julgranen') == 'off' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id:
                                - light.julgranen
                            # data:
                            #   brightness: 255
                    default:
                      - action: light.turn_off
                        target:
                          entity_id:
                            - light.julgranen


      - conditions:
          - condition: trigger
            id: "pyssel_remote"

        sequence:
          - variables:
              button: "{{ trigger.entity_id.split('.')[1] }}"
              action: "{{ trigger.to_state.attributes.event_type }}"

          - alias: "Remote buttons"
            choose:
              - alias: "Upper button pressed once"
                conditions: "{{ button == 'allrum_pyssel_remote_button_1' }}"
                sequence:
                  - choose:
                      - conditions:
                          - alias: "if single press"
                            condition: "{{ action == 'multi_press_1' }}"
                          - alias: "if led strip is off"
                            condition: state
                            entity_id:
                              - light.pyssel_led_strip
                            state: "off"

                        sequence:
                          - alias: "turn on led strip"
                            action: light.turn_on
                            target:
                              entity_id: light.pyssel_led_strip
                            data:
                              color_temp_kelvin: 3558
                              brightness: 20

                      - conditions:
                          - alias: "if single press"
                            condition: "{{ action == 'multi_press_1' }}"
                          - alias: "if led strip is on"
                            condition: state
                            entity_id:
                              - light.pyssel_led_strip
                            state: "on"

                        sequence:
                          - action: input_select.select_next
                            target:
                              entity_id: input_select.rgb_pyssel
                            data:
                              cycle: true
                          - action: light.turn_on
                            target:
                              entity_id: light.pyssel_led_strip
                            data:
                              rgb_color: "{{ states('input_select.rgb_pyssel').split(':')[1] }}"
                              brightness: 40

                              
                      - conditions:
                          - alias: "if double or long press"
                            condition: "{{ action in ['multi_press_2', 'long_press'] }}"

                        sequence:
                          - alias: "turn on led strip with whitish color"
                            action: light.turn_on
                            target:
                              entity_id: light.pyssel_led_strip
                            data:
                              brightness: 20
                              color_temp_kelvin: 3558

              - alias: "Lower button pressed once"
                conditions: "{{ button == 'allrum_pyssel_remote_button_2' and action == 'multi_press_1' }}"
                sequence:
                  - alias: "turn off led strip"
                    action: light.turn_off
                    target:
                      entity_id: light.pyssel_led_strip


      - conditions:
          # when no movement is detected for a fair amount of time, consider the room empty and that 'someone' forgot to turn off the lights
          - condition: trigger
            id: senile
        sequence:
          # turn off all lights
          - action: light.turn_off
            entity_id:
              - light.family_room_ceiling

      - conditions:
          - condition: state
            # when there is daylight
            entity_id:
              - input_boolean.house_mode_bright_inside
            state: "on"

        sequence:
          - &turn_off # turn off lights
            action: light.turn_off
            target:
              entity_id:
                - light.family_room_window_1
                - light.mushroom_lamp
            data:
              transition: 5

      - conditions:
          - condition: or
            conditions:
              - condition: and
                # turn on lights if
                conditions:
                  - condition: time
                    # at specific time in the morning
                    after: input_datetime.time_goodmorning
                    # but before a specific time in the evening
                    before: input_datetime.time_goodnight

        sequence:
          - &scene_turn_on
            action: scene.turn_on
            target:
              entity_id:
                - scene.family_room_ambience_lights_cozy
                - scene.family_room_window_lights_cozy
            data:
              transition: 5

    default:
      - *turn_off
