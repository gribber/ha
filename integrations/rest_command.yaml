update_ev_log:
  url: !secret ev_report_url
  method: POST
  content_type: "application/x-www-form-urlencoded"
  verify_ssl: true
  payload: "sek={{ states('sensor.ctek_monthly_cost_import')|round(0, 'ceil', 0) }}&kwh={{ states('sensor.ctek_monthly_energy')|round(1) }}&date={{ now().strftime('%Y-%m-%d') }}"