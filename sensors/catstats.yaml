- platform: history_stats
  name: "Frej outside today"
  entity_id: binary_sensor.pet_frej
  <<: &duration_today
    state: "off"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"

- platform: history_stats
  name: "Pelle outside today"
  entity_id: binary_sensor.pet_pelle
  <<: *duration_today

- platform: history_stats
  name: "Frej exits today"
  entity_id: binary_sensor.pet_frej
  <<: &exits_today
    state: "off"
    type: count
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"

- platform: history_stats
  name: "Pelle exits today"
  entity_id: binary_sensor.pet_pelle
  <<: *exits_today
